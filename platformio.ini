; Default build: ESP32-2432S028 "Cheap Yellow Display" with two USB ports
; (USB-C + micro USB). Use env:cyd for the single micro-USB version and
; env:esp32_pc_control_deck for the original Elecrow board.
[platformio]
default_envs = cyd2usb

[env]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.31
    bblanchon/ArduinoJson@7.4.3

[cyd_common]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DCYD_TOUCH=1
    -DCYD_RGB_LED_OFF=1

; ESP32-2432S028 with USB-C + micro USB (colours need inversion)
[env:cyd2usb]
build_flags =
    ${cyd_common.build_flags}
    -DTFT_INVERSION_ON=1
    -DCYD_GAMMA_FIX=1

; ESP32-2432S028R with micro USB only
[env:cyd]
build_flags =
    ${cyd_common.build_flags}
    -DTFT_INVERSION_OFF=1

; Original target: Elecrow 2.8-inch ESP32 Solo Miner display
[env:esp32_pc_control_deck]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=4
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=16000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=1000000
